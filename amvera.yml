---
meta:
  environment: nodejs
  toolchain:
    name: npm
    version: 22.12.0
build:
  skip: false
  additionalCommands: npm run build
  artifacts:
    '*': /
run:
  persistenceMount: /data
  scriptName: npm run build
  scriptArguments: null
  nodeArguments: null
  command: npm run start
  containerPort: 80
  singleton: true
  zeroDowntime: false
