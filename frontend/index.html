<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <title>Финансы PRO+</title>

 <meta name="theme-color" content="#1a0f3a" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Финансы PRO+" />

  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="apple-touch-icon" href="/img/favicon.png" />
  <link rel="mask-icon" href="/favicon.svg" color="#0284c7" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- ✅ Устанавливаем ТОЛЬКО data-app-theme, БЕЗ inline background -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('finance-app-theme-v1') || 'auto';
        var isDark = false;
        if (stored === 'dark') isDark = true;
        else if (stored === 'auto') {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        var theme = isDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-app-theme', theme);
        document.documentElement.style.colorScheme = theme;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDark ? '#0a0612' : '#eef2f8');
      } catch (e) {
        document.documentElement.setAttribute('data-app-theme', 'light');
      }
    })();
  </script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      min-height: 100%;
    }
    /* ✅ Фон только через CSS-атрибут, БЕЗ inline-стилей — 
       чтобы можно было менять на лету */
    html[data-app-theme="dark"] { background: #0a0612; }
    html[data-app-theme="light"] { background: #eef2f8; }

    #app {
      min-height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }
  </script>

  <script>
    (function () {
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
